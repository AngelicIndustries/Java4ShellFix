# Identity
modName = Java4ShellFix
modId = java4shellfix
modGroup = industries.angelic.java4shellfix
# Fallback version for local builds. CI/release overrides it with the git tag via the VERSION env var.
modVersion = 1.0.0

# Which loaders and Minecraft versions one jar is published for. Keep these in sync with the README.
publishLoaders = fabric,quilt,forge,neoforge
publishGameVersions = \
    1.17.1,1.18.2,1.19.2,1.19.4,1.20.1,1.20.2,1.20.4,1.20.6,1.21.1,1.21.4,1.21.8,26.1,26.2,26.3

# Publishing. Tokens come from the environment: MODRINTH_TOKEN, CURSEFORGE_TOKEN, SIX_SEVEN_TOKEN,
# GITHUB_TOKEN. Modrinth and 67minecraft tokens for this account live in ../67CREDS/.env.
modrinthProjectId = ujaxLrv7
curseForgeProjectId = 1814739
curseForgeEnvironments = client,server
67minecraftProjectId = 4dY5rOAR
publish67ScriptTag = 1.0.4

# 67minecraft publish script inputs (read by the house 67minecraft-publish.gradle.kts under -Ppublishing).
# 67minecraft's game-version list lags behind Modrinth/CurseForge, so it omits versions 67 does not
# yet know (e.g. 26.3). Add them here once 67minecraft lists them.
67minecraftLoaders = forge,fabric,neoforge,quilt
67minecraftGameVersions = \
    1.17.1,1.18.2,1.19.2,1.19.4,1.20.1,1.20.2,1.20.4,1.20.6,1.21.1,1.21.4,1.21.8,26.1,26.2

org.gradle.parallel = true
org.gradle.caching = true
